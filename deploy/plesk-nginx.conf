# Plesk → Websites & Domeinen → voorraad.tochtstripdeur.nl → Apache & nginx-instellingen
#   → "Aanvullende nginx-richtlijnen" (Additional nginx directives): plak onderstaande regels.
# Pas de poort aan als VOORRAAD_PORT in .env iets anders dan 3000 is.
location ~ ^/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Live-updates van het dashboard (Server-Sent Events) niet bufferen.
    proxy_buffering off;
    proxy_read_timeout 1h;
}
