# Draait het voorraadbeheer 24/7 op een eigen server (VPS), met automatische HTTPS.
#   1. Zet DOMAIN in .env (bijv. DOMAIN=voorraad.tochtstripdeur.nl) en laat die
#      (sub)domeinnaam met een A-record naar het IP-adres van de server wijzen.
#   2. docker compose up -d --build
# Beide containers starten automatisch opnieuw na een storing of herstart van de server.
services:
  voorraad:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /data/voorraad.db
      BACKUP_DIR: /data/backups
      TRUST_PROXY: "true"
    volumes:
      - voorraad-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Zet DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - voorraad

volumes:
  voorraad-data:
  caddy-data:
